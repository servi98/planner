<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" id="themeColor" content="#F4F1EB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planner">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
/* Fonts ship with the app so the phone and the laptop render the same thing.
   latin loads always; latin-ext only if a character in its range is used. */
@font-face{font-family:Fraunces;font-style:normal;font-weight:400 700;font-display:swap;
  src:url(fonts/fraunces-latin.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Fraunces;font-style:normal;font-weight:400 700;font-display:swap;
  src:url(fonts/fraunces-latin-ext.woff2) format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:400 500;font-display:swap;
  src:url(fonts/plex-sans-latin.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:400 500;font-display:swap;
  src:url(fonts/plex-sans-latin-ext.woff2) format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;
  src:url(fonts/plex-mono-latin.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;
  src:url(fonts/plex-mono-latin-ext.woff2) format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{
  --paper:#F4F1EB; --surface:#FBF9F5; --sunk:#EAE6DC;
  --ink:#201E1B; --ink-2:#55514A; --muted:#8A8478;
  --rule:#E7E2D8; --rule-soft:#F0ECE3;
  --accent:#2A3D66; --accent-ink:#FBF9F5; --accent-soft:#DDE3EE;
  --amber:#A9762A; --amber-soft:#F2E7D2;
  --danger:#9A3324;
  --scrim:rgba(32,30,27,.45);
  --radius:10px;
  --serif:Fraunces,"Hoefler Text","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"IBM Plex Sans","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,"SF Mono",monospace;
  --shadow:0 1px 2px rgba(32,30,27,.06);
}
html[data-theme="dark"]{
  --paper:#191714; --surface:#211E1A; --sunk:#16140F;
  --ink:#E8E2D6; --ink-2:#B5AE9F; --muted:#857E70;
  --rule:#302B24; --rule-soft:#262119;
  --accent:#9FB3D9; --accent-ink:#14181F; --accent-soft:#252C3A;
  --amber:#D6A45C; --amber-soft:#2C2418;
  --danger:#E08D7B;
  --scrim:rgba(10,9,7,.6);
  --shadow:none;
}
/* Night is the dark palette taken down again, for the hours after the evening
   hour. Nothing here rises above 80% relative luminance. */
html[data-theme="night"]{
  --paper:#141210; --surface:#1B1815; --sunk:#100F0C;
  --ink:#CFC7B8; --ink-2:#9E978A; --muted:#888072;
  --rule:#2A2620; --rule-soft:#211E18;
  --accent:#8494B0; --accent-ink:#11141A; --accent-soft:#1F2531;
  --amber:#B98F4F; --amber-soft:#251F15;
  --danger:#C47A6A;
  --scrim:rgba(6,5,4,.66);
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.wrap{max-width:1120px;margin:0 auto;padding:0 24px 80px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:26px 0 12px;flex-wrap:wrap}
.datestack .dow{font-family:var(--serif);font-size:26px;line-height:1.1}
.datestack .full{color:var(--muted);font-size:13px;margin-top:2px}
.topbtns{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--rule);background:var(--surface);padding:7px 13px;border-radius:99px;font-size:13.5px;color:var(--ink-2);box-shadow:var(--shadow);text-align:center}
.btn:hover{border-color:var(--ink-2);color:var(--ink)}
.btn.solid{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.solid:hover{filter:brightness(1.08)}
.btn.ghost{background:none;box-shadow:none}
.btn.sm{padding:4px 10px;font-size:12.5px}
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-bottom:24px;overflow-x:auto}
nav.tabs button{padding:9px 14px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .ic,.moretab{display:none}
.topbtns .ic{display:none}
.topbtns .ic svg,nav.tabs .ic svg{width:20px;height:20px;display:block}
.datestack .short{display:none}
.morerow{display:flex;align-items:center;gap:12px;width:100%;padding:13px 2px;font-size:15px;
  color:var(--ink);border-bottom:1px solid var(--rule-soft)}
.morerow .ic svg{width:20px;height:20px;display:block;color:var(--muted)}
.morerow.on{color:var(--accent)}
.morerow.on .ic svg{color:var(--accent)}
.banner{background:var(--sunk);border:1px solid var(--rule);padding:10px 14px;border-radius:var(--radius);font-size:13.5px;margin-bottom:18px}

.cols{display:grid;grid-template-columns:1fr 300px;gap:32px;align-items:start}
/* grid items default to min-width:auto, which lets a wide row push the whole
   column past its track and scroll the page sideways on a phone */
.cols>*{min-width:0}
@media(max-width:900px){.cols{grid-template-columns:1fr;gap:24px}}
/* light separates on tone alone; dark needs a hairline, tone is not enough there.
   Border stays present but transparent so the box geometry is identical either way. */
.card{background:var(--surface);border:1px solid transparent;border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:18px}
html[data-theme="dark"] .card{border-color:var(--rule-soft)}
/* card titles are labels, not headlines: the serif is reserved for the one
   task and for dates, and nothing else on the page competes with them */
h2.sec{font-family:var(--sans);font-size:12px;font-weight:500;color:var(--muted);
  letter-spacing:.06em;text-transform:uppercase;margin:0 0 12px}
.why{color:var(--muted);font-size:12.5px;margin:-6px 0 12px;line-height:1.45}
.hint{font-size:12.5px;color:var(--muted);margin-top:10px}
.tip{border-left:2px solid var(--rule);padding-left:10px;font-size:12.5px;color:var(--muted);margin:12px 0 0;line-height:1.5}

.mit{border-top:2px solid var(--accent);margin-top:26px;padding-top:22px;margin-bottom:32px}
.mit .lead{color:var(--muted);font-size:12.5px;margin-bottom:6px}
.mit input.big{font-family:var(--serif);font-size:30px;line-height:1.25;width:100%;background:none;border:none;padding:0 0 4px}
@media(max-width:600px){.mit input.big{font-size:24px}}
.mit input.big::placeholder{color:var(--muted);opacity:.6}
.mit .row{display:flex;align-items:center;gap:13px;margin-top:8px;flex-wrap:wrap}
.when{display:flex;align-items:center;gap:8px;margin-top:6px}
.when input{flex:1;min-width:0;text-overflow:ellipsis;background:none;border:none;border-bottom:1px dashed var(--rule);padding:3px 0;font-size:14px;color:var(--ink-2)}

.task{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--rule-soft)}
.task:last-child{border-bottom:none}
.task input.txt{flex:1;min-width:60px;background:none;border:none;padding:4px 0}
.task input.txt::placeholder{color:var(--muted);opacity:.6}
/* nothing to estimate until there is something written, but the space is held
   so the row does not jump sideways on the first keystroke */
.task.empty .est,.task.empty .dots{visibility:hidden}
.task.done input.txt{color:var(--muted);text-decoration:line-through}
.check{width:17px;height:17px;border:1.5px solid var(--rule);border-radius:5px;flex:none;display:grid;place-items:center}
.check:hover{border-color:var(--ink-2)}
.check.on{background:var(--accent);border-color:var(--accent)}
.check.on::after{content:"";width:9px;height:5px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px)}
.est{font-size:11.5px;color:var(--muted);border:1px solid var(--rule);border-radius:99px;padding:1px 8px;flex:none}
.est.set{color:var(--ink-2);border-color:var(--ink-2)}
/* the visible dot stays small, the button around it stays thumb-sized */
.dots{display:flex;gap:1px;flex:none}
.dot{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center}
.dot::before{content:"";width:11px;height:11px;border-radius:50%;border:1.5px solid var(--rule);box-sizing:border-box}
.dot.plan::before{border-color:var(--amber)}
.dot.on::before{background:var(--amber);border-color:var(--amber)}

.timer{text-align:center}
.ring{position:relative;width:168px;height:168px;margin:2px auto 10px}
.ring svg{transform:rotate(-90deg)}
.ring .track{stroke:var(--sunk)}
.ring .prog{stroke:var(--amber);stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.ring.break .prog{stroke:var(--muted)}
.ring .readout{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .clock{font-family:var(--mono);font-size:34px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ring .mode{font-size:12px;color:var(--muted);margin-top:2px}
.timerbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tlink{font-size:12.5px;color:var(--muted);margin-top:10px}
.tlink b{color:var(--ink);font-weight:500}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--rule);border-radius:99px;padding:5px 12px;font-size:13px;color:var(--ink-2)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip .tick{color:var(--accent);margin-right:5px}

label.f{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 5px}
label.f:first-child{margin-top:0}
textarea,input.line,select{width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:9px 11px;resize:vertical;font-size:14.5px}
html[data-theme="dark"] textarea,html[data-theme="dark"] input.line,html[data-theme="dark"] select{background:var(--sunk)}
textarea{min-height:62px;line-height:1.55}
.scorerow{display:flex;gap:5px;flex-wrap:wrap}
.sc{width:31px;height:31px;border:1px solid var(--rule);border-radius:8px;font-size:13px;color:var(--ink-2);text-align:center}
.sc:hover{border-color:var(--ink-2)}
.sc.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.pair{grid-template-columns:1fr}}

.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.calhead h2{font-family:var(--serif);font-weight:normal;font-size:20px;margin:0}
.weekgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
@media(max-width:760px){.weekgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:460px){.weekgrid{grid-template-columns:1fr}}
.daycol{background:var(--surface);border:1px solid var(--rule-soft);border-radius:9px;padding:9px;min-height:178px;display:flex;flex-direction:column}
.daycol.today{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.daycol.past{background:var(--sunk)}
.dhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.dhead .dw{font-size:11px;color:var(--muted)}
.dhead .dn{font-family:var(--serif);font-size:18px}
.ev{display:block;width:100%;font-size:11.5px;line-height:1.35;padding:3px 6px;border-radius:5px;background:var(--sunk);color:var(--ink-2);margin-bottom:4px;border-left:2px solid var(--rule)}
.ev .t{color:var(--muted);margin-right:4px}
.ev.more{background:none;color:var(--muted);border:none;padding-left:0}
/* a run squares off the edges it continues through, so consecutive days read as
   one band rather than as repeated chips */
.ev.contl{border-top-left-radius:0;border-bottom-left-radius:0;border-left:none;padding-left:8px}
.ev.contr{border-top-right-radius:0;border-bottom-right-radius:0}
.ev.span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dmit{font-size:11.5px;color:var(--ink-2);margin-top:auto;padding-top:6px;border-top:1px dotted var(--rule)}
.dmit .sc2{color:var(--muted)}
.addev{font-size:11.5px;color:var(--muted);padding:2px 0}
.addev:hover{color:var(--ink)}
.opend{font-size:11.5px;color:var(--muted)}
.opend:hover{color:var(--ink)}

.monthgrid{width:100%;border-collapse:separate;border-spacing:5px;table-layout:fixed}
.monthgrid th{font-weight:normal;color:var(--muted);font-size:11.5px;padding-bottom:2px}
.mcell{background:var(--surface);border:1px solid var(--rule-soft);border-radius:8px;padding:5px 6px;height:96px;vertical-align:top;overflow:hidden}
.mcell.today{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.mcell.out{background:none;border-color:transparent}
.mcell .num{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;align-items:center}
.mcell .num .s{font-size:9.5px;color:var(--muted);font-family:var(--sans)}
.mcell .ev{font-size:10.5px;padding:1px 4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* single events do not fit a phone month cell, but a trip is the whole reason to
   look at the month, so runs stay as a thin bar with the text dropped */
@media(max-width:700px){
  .mcell{height:72px}
  .mcell .ev{display:none}
  .mcell .ev.span{display:block;height:5px;padding:0;margin-bottom:2px;font-size:0;line-height:0;border-radius:3px}
  .mcell .ev.span.contl{border-radius:0 3px 3px 0}
  .mcell .ev.span.contr{border-radius:3px 0 0 3px}
  .mcell .ev.span.contl.contr{border-radius:0}
  .mcell .ev.span:not(.contl){border-left:2px solid var(--rule)}
}

.hwrap{overflow-x:auto}
table.hab{border-collapse:separate;border-spacing:3px}
table.hab th{font-weight:normal;font-size:10.5px;color:var(--muted);padding:0;text-align:center}
table.hab th.name{text-align:left;font-size:13.5px;color:var(--ink);white-space:nowrap;padding-right:12px;position:sticky;left:0;background:var(--surface);z-index:2}
table.hab th.name .cue{display:block;font-size:11px;color:var(--muted)}
table.hab th.wd{width:22px;line-height:1.25}
table.hab th.wd.tod{color:var(--ink)}
.hcell{width:22px;height:22px;border:1px solid var(--rule);border-radius:5px;display:block}
.hcell.on{background:var(--accent);border-color:var(--accent)}
.hcell.fut{opacity:.3;cursor:default}
.hcell.miss{background:repeating-linear-gradient(45deg,transparent,transparent 3px,var(--sunk) 3px,var(--sunk) 6px)}
.hcell.tod{box-shadow:0 0 0 1px var(--ink)}
.hstat{font-size:12px;color:var(--muted);white-space:nowrap;padding-left:12px;text-align:left}
.hstat b{color:var(--ink);font-weight:500}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat .n{font-family:var(--mono);font-size:24px;font-variant-numeric:tabular-nums}
.stat .l{font-size:11.5px;color:var(--muted);line-height:1.35}
.wins{margin:0;padding-left:17px;font-size:13.5px;color:var(--ink-2)}
.wins li{margin-bottom:3px}

.entry{border-bottom:1px solid var(--rule-soft);padding:13px 0}
.entry:last-child{border:none}
.entry .h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.entry .dt{font-family:var(--serif);font-size:15px}
.entry p{margin:5px 0 0;font-size:13.5px;color:var(--ink-2)}
.entry .q{border-left:2px solid var(--rule);padding-left:10px}
.pill{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:99px;background:var(--sunk);color:var(--ink-2)}

.capture{display:flex;gap:6px}
.capture input{flex:1}
.caplist{margin:10px 0 0;padding:0;list-style:none}
.caplist li{display:flex;gap:8px;align-items:center;font-size:13.5px;padding:3px 0;color:var(--ink-2)}
.caplist button.x{color:var(--muted);font-size:16px;line-height:1;margin-left:auto}

.scrim{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;padding:18px;z-index:40}
#modal2 .scrim{z-index:60}
#more .scrim{z-index:70}
.sheet{background:var(--surface);border-radius:14px;max-width:620px;width:100%;max-height:92vh;overflow:auto;padding:26px 28px;border:1px solid var(--rule)}
.sheet.narrow{max-width:400px}
@media(max-width:600px){.sheet{padding:20px 18px}}
.sheet h3{font-family:var(--sans);font-weight:500;font-size:20px;letter-spacing:-.01em;margin:6px 0 4px}
.sheet .lead{color:var(--muted);font-size:13.5px;margin:0 0 18px}
.steps{display:flex;gap:5px;margin-bottom:16px}
.steps i{height:3px;flex:1;background:var(--rule);border-radius:2px}
.steps i.on{background:var(--ink-2)}
.steps i.past{background:var(--rule)}
.sheetfoot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px}
.settingrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule-soft)}
.settingrow:last-child{border:none}
.settingrow .lbl{font-size:14px}
.settingrow .desc{font-size:12.5px;color:var(--muted)}
.settingrow select,.settingrow input{width:auto;min-width:80px}
.del{color:var(--danger)}

/* sync */
.syncbtn{font-size:12px;color:var(--muted);padding:6px 8px;white-space:nowrap}
.syncbtn:hover{color:var(--ink)}
.syncbtn .led{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--rule);margin-right:5px;vertical-align:middle}
.syncbtn.on .led{background:var(--ink-2)}
.syncbtn.busy .led{background:var(--muted)}
.syncbtn.bad .led{background:var(--danger)}
.mono{font-family:var(--mono);font-size:12.5px}

/* phone */
@media(max-width:640px){
  .wrap{padding:0 14px calc(72px + env(safe-area-inset-bottom))}
  header.top{padding:16px 0 8px}
  .datestack .dow{font-size:21px}
  .card{padding:15px 15px;margin-bottom:14px}
  .mit{margin-top:16px;padding-top:18px;margin-bottom:24px}
  /* tab bar moves into the thumb zone */
  nav.tabs{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:30;margin:0;
    display:grid;grid-template-columns:repeat(5,1fr);gap:0;overflow:visible;
    background:var(--surface);border-top:1px solid var(--rule);border-bottom:none;
    padding-bottom:env(safe-area-inset-bottom)}
  nav.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    padding:7px 1px 6px;font-size:9.5px;line-height:1.2;border-bottom:none;margin:0;
    letter-spacing:.01em;min-height:52px}
  nav.tabs button.on{color:var(--accent);border-bottom:none}
  nav.tabs .ic{display:block}
  nav.tabs button[data-v="history"],nav.tabs button[data-v="settings"]{display:none}
  nav.tabs .moretab{display:flex}
  /* header keeps only the date and the sync badge once the page moves */
  header.top{position:sticky;top:0;z-index:20;background:var(--paper)}
  body.scrolled header.top{padding:0;min-height:44px;flex-wrap:nowrap;align-items:center;
    border-bottom:1px solid var(--rule-soft)}
  body.scrolled .datestack .dow,body.scrolled .datestack .full{display:none}
  body.scrolled .datestack .short{display:block;font-size:14px;color:var(--ink);white-space:nowrap}
  body.scrolled .topbtns .lbl{display:none}
  body.scrolled .topbtns .ic{display:block}
  body.scrolled .topbtns .btn{padding:7px 9px}
  body.scrolled .syncbtn{padding:6px 4px;min-width:0;overflow:hidden}
  body.scrolled #syncTxt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  body.scrolled .datestack{flex:none}
  body.scrolled .topbtns{flex:none}
  .task{padding:9px 0}
  .task input.txt{padding:6px 0}
  /* the hint is too long to sit beside its label on a phone, so it gets its own line */
  .when{flex-wrap:wrap;gap:2px 8px}
  .when input{flex-basis:100%;font-size:13.5px}
  .dot::before{width:13px;height:13px}
  .check{width:20px;height:20px}
  .sc{width:30px;height:34px}
  .chip{padding:7px 13px}
  .hcell{width:26px;height:26px}
  table.hab th.wd{width:26px}
  .btn{padding:8px 14px}
  .btn.sm{padding:6px 11px}
  .sheet{max-height:88vh;border-radius:14px}
  .weekgrid{gap:8px}
  .daycol{min-height:0}
  .monthgrid{border-spacing:3px}
  .mcell{height:58px;padding:3px 4px}
  .stats{gap:10px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="datestack"><div class="dow" id="hdrDow"></div><div class="full" id="hdrFull"></div><div class="short" id="hdrShort"></div></div>
    <div class="topbtns">
      <button class="syncbtn" id="syncBtn" data-act="syncnow"><span class="led"></span><span id="syncTxt">Sync off</span></button>
      <button class="btn solid" data-act="flow" aria-label="Check in"><span class="ic" id="flowIc"></span><span class="lbl">Check in</span></button>
      <button class="btn ghost" data-act="theme" id="themeBtn"><span class="ic" id="themeIc"></span><span class="lbl" id="themeLbl">Dark</span></button>
    </div>
  </header>
  <div id="warn"></div>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
</div>
<div id="modal"></div>
<div id="modal2"></div>
<div id="more"></div>

<script>
(function(){
"use strict";

/* ---------------- storage ---------------- */
var KEY="planner.v1", DATA_V=2, ok=true, S=null, saveTimer=null;
function blankTask(){return{text:"",est:0,done:0,ok:false}}
function blankState(){return{
  v:DATA_V,
  settings:{name:"",evening:19,focusMin:25,breakMin:5,theme:"auto"},
  meta:{lastFlow:"",lastBackup:""},
  habits:[{id:"h1",name:"Deep work block",cue:"after the first coffee",arch:false,u:1},
          {id:"h2",name:"Move for 30 minutes",cue:"before lunch",arch:false,u:1},
          {id:"h3",name:"Read before bed",cue:"after the phone goes on the charger",arch:false,u:1}],
  days:{},weeks:{},months:{},events:{},timer:null
}}
function load(){try{var r=localStorage.getItem(KEY);return r?JSON.parse(r):blankState()}catch(e){ok=false;return blankState()}}
function save(){
  if(!ok)return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){ok=false;warn()}},250);
  schedulePush();
}
/* every edit stamps the record it touched, which is what lets two devices merge */
function stamp(o){if(o)o.u=Date.now();return o}
function touchDay(k){if(/^\d{4}-\d{2}-\d{2}$/.test(k))stamp(D(k))}
function touchRec(kind,k){stamp(kind==="d"?D(k):kind==="w"?W(k):M(k))}
function warn(){
  document.getElementById("warn").innerHTML=ok?"":
    '<div class="banner">Nothing is being saved here. This is a preview. Put the file on your PC and open it with the shortcut to keep your entries.</div>';
}

/* ---------------- dates ---------------- */
var DOW=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
function p2(n){return(n<10?"0":"")+n}
function dkey(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function parseKey(k){var a=k.split("-");return new Date(+a[0],+a[1]-1,+a[2])}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function monStart(d){var x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x}
function wkey(d){var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),dn=t.getUTCDay()||7;
  t.setUTCDate(t.getUTCDate()+4-dn);var y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return t.getUTCFullYear()+"-W"+p2(Math.ceil((((t-y0)/864e5)+1)/7))}
function weekStartOf(k){var a=k.split("-W");return addDays(monStart(new Date(+a[0],0,4)),(+a[1]-1)*7)}
function mkey(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)}
function monthStartOf(k){var a=k.split("-");return new Date(+a[0],+a[1]-1,1)}
function longDate(d){return DOW[d.getDay()]+", "+MON[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear()}
function shortDate(d){return MON[d.getMonth()].slice(0,3)+" "+d.getDate()}
function isToday(d){return dkey(d)===dkey(new Date())}
function lastOfMonth(d){return d.getDate()===new Date(d.getFullYear(),d.getMonth()+1,0).getDate()}
function daysIn(d){return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()}

/* ---------------- records ---------------- */
function D(k){
  var d=S.days[k]||(S.days[k]={});
  if(!d.mit)d.mit=blankTask();
  if(d.when===undefined)d.when="";
  if(!d.sec)d.sec=[blankTask(),blankTask()];
  if(!d.other)d.other=[blankTask(),blankTask(),blankTask(),blankTask(),blankTask()];
  if(d.score===undefined)d.score=null;
  if(d.wentWell===undefined)d.wentWell="";
  if(d.improve===undefined)d.improve="";
  if(!d.habits)d.habits={};
  if(!d.capture)d.capture=[];
  if(d.shutdown===undefined)d.shutdown=false;
  return d;
}
function W(k){
  var w=S.weeks[k]||(S.weeks[k]={});
  if(w.goal===undefined)w.goal="";
  if(!w.focus)w.focus=["","",""];
  if(!w.ifthen)w.ifthen={"if":"","then":""};
  if(!w.review)w.review={well:"",bad:"",learned:"",next:""};
  return w;
}
function M(k){
  var m=S.months[k]||(S.months[k]={});
  if(m.theme===undefined)m.theme="";
  if(!m.goals)m.goals=["","",""];
  if(!m.review)m.review={well:"",bad:"",learned:"",next:""};
  return m;
}
function EV(k){if(!S.events)S.events={};return S.events[k]||(S.events[k]=[])}
function tasksOf(d){return[d.mit].concat(d.sec,d.other)}
function hasDay(k){var d=S.days[k];if(!d)return false;return !!(d.mit&&d.mit.text)||d.score!=null}
function dayPlanned(k){return !!D(k).mit.text}
function dayReviewed(k){return D(k).score!=null}
function weekPlanned(k){return !!W(k).goal}
function weekReviewed(k){return !!W(k).review.well}
function monthPlanned(k){return !!M(k).theme}
function monthReviewed(k){return !!M(k).review.well}
function habitsLive(){return S.habits.filter(function(h){return !h.arch&&!h.del})}

/* ---------------- helpers ---------------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function el(id){return document.getElementById(id)}
var view="today", cursor=dkey(new Date());
function rec(kind,k){return kind==="d"?D(k):kind==="w"?W(k):M(k)}
function getBind(p){var a=p.split("|");return a[2].split(".").reduce(function(c,x){return c[x]},rec(a[0],a[1]))}
function setBind(p,v){var a=p.split("|"),o=rec(a[0],a[1]),ps=a[2].split("."),c=o;
  for(var i=0;i<ps.length-1;i++)c=c[ps[i]];c[ps[ps.length-1]]=v;stamp(o);save()}
function taskAt(p){var a=p.split("|"),d=D(a[1]);return a[2]==="mit"?d.mit:d[a[2]][+a[3]]}
function ta(p,ph){return '<textarea data-bind="'+p+'" placeholder="'+esc(ph)+'">'+esc(getBind(p))+'</textarea>'}
function line(p,ph){return '<input class="line" data-bind="'+p+'" value="'+esc(getBind(p))+'" placeholder="'+esc(ph)+'">'}

/* ---------------- shared blocks ---------------- */
function taskRow(dk,group,i,ph){
  var t=D(dk)[group][i], path="task|"+dk+"|"+group+"|"+i, dots="";
  for(var j=0;j<5;j++)
    dots+='<button class="dot'+(j<t.done?" on":(j<t.est?" plan":""))+'" data-act="dot" data-p="'+path+'" data-i="'+j+'" title="Focus sessions finished"></button>';
  return '<div class="task'+(t.ok?" done":"")+(t.text?"":" empty")+'">'+
    '<button class="check'+(t.ok?" on":"")+'" data-act="check" data-p="'+path+'" aria-label="Mark done"></button>'+
    '<input class="txt" data-task="'+path+'" value="'+esc(t.text)+'" placeholder="'+esc(ph)+'">'+
    '<button class="est'+(t.est?" set":"")+'" data-act="est" data-p="'+path+'" title="Sessions you expect it to take">'+(t.est?t.est+" est":"est")+'</button>'+
    '<div class="dots">'+dots+'</div></div>';
}
/* The loose list shows two empty rows, not five, and earns another whenever the
   last one is written in. Counting from the last filled row rather than the
   number of filled ones means an old record with a gap in it still shows
   everything it holds. */
function otherRowsHtml(dk){
  var o=D(dk).other,last=-1,i,out="";
  for(i=0;i<o.length;i++)if(o[i].text)last=i;
  var n=Math.max(2,last+2);
  while(o.length<n)o.push(blankTask());
  for(i=0;i<n;i++)out+=taskRow(dk,"other",i,"");
  return out;
}
/* Appends straight into the DOM rather than re-rendering, so the row you are
   typing in keeps focus and the caret stays put. */
function growOther(dk,i){
  var cont=el("otherRows");if(!cont)return;
  var shown=cont.children.length;
  if(i!==shown-1)return;
  var o=D(dk).other;
  if(!o[i]||!o[i].text)return;
  while(o.length<shown+1)o.push(blankTask());
  cont.insertAdjacentHTML("beforeend",taskRow(dk,"other",shown,""));
}
function mitBlock(dk,label){
  var d=D(dk);
  return '<div class="mit"><div class="lead">'+esc(label)+'</div>'+
    '<input class="big" data-task="task|'+dk+'|mit|0" value="'+esc(d.mit.text)+'" placeholder="Write it here">'+
    '<div class="when"><span style="color:var(--muted);font-size:12.5px">Starting</span>'+
      '<input data-bind="d|'+dk+'|when" value="'+esc(d.when)+'" placeholder="when and where, for example 8:30 at the desk before email"></div>'+
    '<div class="row">'+
      '<button class="check'+(d.mit.ok?" on":"")+'" data-act="check" data-p="task|'+dk+'|mit|0"></button>'+
      '<button class="est'+(d.mit.est?" set":"")+'" data-act="est" data-p="task|'+dk+'|mit|0">'+(d.mit.est?d.mit.est+" est":"est")+'</button>'+
      '<div class="dots">'+[0,1,2,3,4].map(function(j){
        return '<button class="dot'+(j<d.mit.done?" on":(j<d.mit.est?" plan":""))+'" data-act="dot" data-p="task|'+dk+'|mit|0" data-i="'+j+'"></button>'}).join("")+'</div>'+
      '<button class="btn ghost sm" data-act="attach" data-p="task|'+dk+'|mit|0">Run a session on this</button>'+
    '</div></div>';
}
function habitChips(dk){
  var d=D(dk),hs=habitsLive();
  if(!hs.length)return '<p class="hint">No habits yet. Add them on the Habits tab.</p>';
  return '<div class="chips">'+hs.map(function(h){
    var on=!!d.habits[h.id];
    return '<button class="chip'+(on?" on":"")+'" data-act="habit" data-k="'+dk+'" data-h="'+h.id+'">'+
      (on?'<span class="tick">&#10003;</span>':"")+esc(h.name)+'</button>'}).join("")+'</div>';
}
function scoreRow(dk){
  var d=D(dk),o="";
  for(var i=1;i<=10;i++)o+='<button class="sc'+(d.score===i?" on":"")+'" data-act="score" data-k="'+dk+'" data-v="'+i+'">'+i+'</button>';
  return '<div class="scorerow">'+o+'</div>';
}
/* A trip is one record, not one per day: the event lives under the day it starts
   and may carry an "end". Absent end means a single day, which is every event
   written before this existed. */
function evEndOf(startKey,e){return(e.end&&e.end>startKey)?e.end:startKey}
/* Everything covering this day, and where in its run the day falls. */
function eventsOn(dk){
  var out=[];
  if(!S.events)return out;
  Object.keys(S.events).forEach(function(k){
    if(k>dk)return;
    var list=S.events[k];
    if(!list||!list.length)return;
    list.forEach(function(e){
      if(!e||e.del||!e.id)return;
      var end=evEndOf(k,e);
      if(end<dk)return;
      out.push({e:e,start:k,end:end,span:end!==k,first:k===dk,last:end===dk});
    });
  });
  /* runs first, so a limited cell keeps the trip rather than dropping it */
  out.sort(function(a,b){
    if(a.span!==b.span)return a.span?-1:1;
    return ((a.e.time||"zz")+"|"+(a.e.text||"")).localeCompare((b.e.time||"zz")+"|"+(b.e.text||""));
  });
  return out;
}
function eventList(dk,limit,grid){
  var evs=eventsOn(dk),shown=limit?evs.slice(0,limit):evs;
  var out=shown.map(function(x){
    var cls="ev"+(x.span?" span":"")+(x.first?"":" contl")+(x.last?"":" contr");
    /* in a grid the name repeats at the head of each week so a long band stays readable */
    var named=!grid||x.first||parseKey(dk).getDay()===1;
    var body=named?((x.first&&x.e.time?'<span class="t">'+esc(x.e.time)+'</span>':"")+esc(x.e.text)):"&#8203;";
    return '<button class="'+cls+'" data-act="editev" data-k="'+x.start+'" data-id="'+esc(x.e.id)+
      '" title="'+esc(x.e.text)+'">'+body+'</button>';
  }).join("");
  if(limit&&evs.length>limit)out+='<span class="ev more">+'+(evs.length-limit)+' more</span>';
  return out;
}
function evSummary(dk){
  var evs=eventsOn(dk);
  return evs.length?evs.map(function(x){
    return esc((x.first&&x.e.time?x.e.time+" ":"")+x.e.text)}).join(" &#183; "):"clear";
}

/* ---------------- stats ---------------- */
function rangeStats(keys){
  var pom=0,est=0,done=0,scores=[],hab=0,habMax=0,live=habitsLive(),wins=[];
  keys.forEach(function(k){
    if(!S.days[k])return;
    var d=D(k);
    tasksOf(d).forEach(function(t){pom+=t.done;est+=t.est;if(t.ok&&t.text)done++});
    if(d.mit.ok&&d.mit.text)wins.push(d.mit.text);
    if(d.score!=null)scores.push(d.score);
    if(hasDay(k))live.forEach(function(h){habMax++;if(d.habits[h.id])hab++});
  });
  return{pom:pom,est:est,done:done,wins:wins,
    avg:scores.length?scores.reduce(function(a,b){return a+b},0)/scores.length:null,
    hab:habMax?Math.round(hab/habMax*100):null};
}
function statBlock(st){
  return '<div class="stats">'+
    '<div class="stat"><div class="n">'+st.pom+'</div><div class="l">focus sessions run</div></div>'+
    '<div class="stat"><div class="n">'+st.done+'</div><div class="l">tasks finished</div></div>'+
    '<div class="stat"><div class="n">'+(st.avg==null?"&ndash;":st.avg.toFixed(1))+'</div><div class="l">average day score</div></div>'+
    '<div class="stat"><div class="n">'+(st.hab==null?"&ndash;":st.hab+"%")+'</div><div class="l">habits kept</div></div></div>'+
    (st.est?'<p class="tip">You planned '+st.est+' sessions and ran '+st.pom+
      '. People underestimate almost everything, reliably. Let that gap set the next estimate rather than trying harder.</p>':"");
}
function habitRun(hid){
  var n=0,d=new Date();
  if(!D(dkey(d)).habits[hid])d=addDays(d,-1);
  while(D(dkey(d)).habits[hid]){n++;d=addDays(d,-1)}
  return n;
}
function missedTwice(hid){
  var y=dkey(addDays(new Date(),-1)),z=dkey(addDays(new Date(),-2));
  return !D(y).habits[hid]&&!D(z).habits[hid]&&(hasDay(y)||hasDay(z));
}

/* ---------------- views ---------------- */
var TABS=[["today","Today"],["week","Week"],["month","Month"],["habits","Habits"],["history","History"],["settings","Settings"]];
/* Line icons for the phone tab bar. Stroked in currentColor so the active tab
   picks up the accent and the rest stay in the substrate. */
function svg(d,extra){return '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+(extra||"")+'</svg>'}
var ICON={
  today:svg('<rect x="4" y="3" width="12" height="14" rx="2"/><path d="M7.5 8h5M7.5 11.5h3"/>'),
  week:svg('<rect x="2.5" y="5" width="15" height="10" rx="1.5"/><path d="M7.5 5v10M12.5 5v10"/>'),
  month:svg('<rect x="3" y="4" width="14" height="13" rx="2"/><path d="M3 8h14M8 8v9M13 8v9"/>'),
  habits:svg('<path d="M3 6.5l1.8 1.8L8 5"/><path d="M3 13.5l1.8 1.8L8 12"/><path d="M11 7h6M11 14.5h6"/>'),
  history:svg('<circle cx="10" cy="10" r="7"/><path d="M10 6v4.2l2.8 1.8"/>'),
  settings:svg('<circle cx="10" cy="10" r="2.6"/><path d="M10 2.6v2M10 15.4v2M17.4 10h-2M4.6 10h-2M15.2 4.8l-1.4 1.4M6.2 13.8l-1.4 1.4M15.2 15.2l-1.4-1.4M6.2 6.2L4.8 4.8"/>'),
  more:svg('<circle cx="4.5" cy="10" r="1.3" fill="currentColor" stroke="none"/><circle cx="10" cy="10" r="1.3" fill="currentColor" stroke="none"/><circle cx="15.5" cy="10" r="1.3" fill="currentColor" stroke="none"/>'),
  flow:svg('<circle cx="10" cy="10" r="7.3"/><path d="M6.6 10.2l2.4 2.4 4.4-4.9"/>'),
  sun:svg('<circle cx="10" cy="10" r="3.6"/><path d="M10 1.8v2.1M10 16.1v2.1M18.2 10h-2.1M3.9 10h-2.1M15.8 4.2l-1.5 1.5M5.7 14.3l-1.5 1.5M15.8 15.8l-1.5-1.5M5.7 5.7L4.2 4.2"/>'),
  moon:svg('<path d="M16.2 11.8A6.8 6.8 0 018.2 3.8a7.2 7.2 0 108 8z"/>')
};
/* On the phone the two reference views live behind More, which leaves four
   daily tabs with room to be hit properly. */
var BAR_HIDDEN=["history","settings"];
function inMore(v){return BAR_HIDDEN.indexOf(v)>=0}
function renderTabs(){
  el("tabs").innerHTML=TABS.map(function(t){
    return '<button data-act="tab" data-v="'+t[0]+'" class="'+(view===t[0]?"on":"")+'" aria-label="'+esc(t[1])+'">'+
      '<span class="ic">'+ICON[t[0]]+'</span><span class="lbl">'+t[1]+'</span></button>'}).join("")+
    '<button data-act="more" class="moretab'+(inMore(view)?" on":"")+'" aria-label="More">'+
      '<span class="ic">'+ICON.more+'</span><span class="lbl">More</span></button>';
}
function partOfDay(){var h=new Date().getHours();return h<12?"morning":h<S.settings.evening?"afternoon":"evening"}
function renderHeader(){
  var d=new Date(),dark=document.documentElement.getAttribute("data-theme")==="dark";
  el("hdrDow").textContent=S.settings.name?"Good "+partOfDay()+", "+S.settings.name:DOW[d.getDay()];
  el("hdrFull").textContent=longDate(d);
  el("hdrShort").textContent=DOW[d.getDay()].slice(0,3)+" "+shortDate(d);
  el("themeLbl").textContent=dark?"Light":"Dark";
  el("themeIc").innerHTML=dark?ICON.sun:ICON.moon;
  el("flowIc").innerHTML=ICON.flow;
}
/* The header gives up everything but the date and the sync badge once the page
   moves, so the thumb zone and the reading area both stay clear. */
var collapsed=false;
function onScroll(){
  var c=(window.pageYOffset||document.documentElement.scrollTop)>48;
  if(c!==collapsed){collapsed=c;document.body.classList.toggle("scrolled",c)}
}

function viewToday(){
  var dk=cursor,d=D(dk),date=parseKey(dk),wk=wkey(date),mk=mkey(date),w=W(wk),m=M(mk);
  var head=isToday(date)?"":'<div class="banner">Viewing '+longDate(date)+
    '. <button class="btn ghost sm" data-act="goto" data-k="'+dkey(new Date())+'">Back to today</button></div>';
  var evs=eventList(dk);
  var cap=d.capture.map(function(c,i){
    return '<li>&#183; '+esc(c)+'<button class="x" data-act="capdel" data-k="'+dk+'" data-i="'+i+'" aria-label="Remove">&times;</button></li>'}).join("");

  var left=mitBlock(dk,"The one task that would make this day count")+

function renderTimer(){
  var c=el("timerCard");if(!c)return;
  var t=S.timer,total=t?t.dur:S.settings.focusMin*60,left=total;
  if(t)left=t.paused?t.left:Math.max(0,Math.round((t.endsAt-Date.now())/1000));
  var R=74,C=2*Math.PI*R,off=C*(1-(total?left/total:0)),task=null;
  if(t&&t.task){try{task=taskAt(t.task)}catch(e){}}
  c.innerHTML='<div class="ring'+(t&&t.mode==="break"?" break":"")+'">'+
    '<svg width="168" height="168"><circle class="track" cx="84" cy="84" r="'+R+'" fill="none" stroke-width="7"></circle>'+
    '<circle class="prog" cx="84" cy="84" r="'+R+'" fill="none" stroke-width="7" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"></circle></svg>'+
    '<div class="readout"><div class="clock">'+p2(Math.floor(left/60))+":"+p2(left%60)+'</div>'+

    '<div class="timerbtns">'+(!t?

      eventList(k,4,true)+

function viewHabits(){

  }
  head+='<th class="hstat">this month</th></tr>';
  var live=habitsLive();
  var body=live.map(function(h){
    var r='<tr><th class="name">'+esc(h.name)+(h.cue?'<span class="cue">'+esc(h.cue)+'</span>':"")+'</th>',hits=0,poss=0;
    for(var i2=1;i2<=total;i2++){
      var d=new Date(y,mo,i2),k=dkey(d);
      var on=!!(S.days[k]&&S.days[k].habits&&S.days[k].habits[h.id]);
      var fut=d>new Date()&&!isToday(d);
      if(!fut){poss++;if(on)hits++}
      r+='<td><button class="hcell'+(on?" on":(fut?" fut":(hasDay(k)?" miss":"")))+(isToday(d)?" tod":"")+
        '" data-act="habit" data-k="'+k+'" data-h="'+h.id+'" aria-label="'+esc(h.name)+" "+k+'"></button></td>';
    }
    r+='<td class="hstat"><b>'+hits+"/"+poss+'</b> &#183; '+habitRun(h.id)+' day run'+
      (missedTwice(h.id)?' &#183; <span style="color:var(--ink)">missed twice</span>':"")+'</td>';
    return r+"</tr>";
  }).join("");
  var manage=S.habits.filter(function(h){return !h.del}).map(function(h){
    return '<div class="settingrow"><div><div class="lbl">'+esc(h.name)+(h.arch?' <span class="desc">(paused)</span>':"")+'</div>'+
      '<div class="desc">'+(h.cue?"Cue: "+esc(h.cue):"No cue set")+'</div></div><div style="white-space:nowrap">'+
      '<button class="btn ghost sm" data-act="hedit" data-h="'+h.id+'">Edit</button> '+

      '<button class="btn ghost sm del" data-act="hdel" data-h="'+h.id+'">Delete</button></div></div>'}).join("");

      '<button class="btn ghost sm" data-act="shiftm" data-n="-1">Previous</button> '+
      '<button class="btn ghost sm" data-act="shiftm" data-n="0">This month</button> '+
      '<button class="btn ghost sm" data-act="shiftm" data-n="1">Next</button></div></div>'+
    '<div class="card"><div class="hwrap"><table class="hab"><thead>'+head+'</thead><tbody>'+
      (body||'<tr><th class="name">Add a habit below to start the grid.</th></tr>')+'</tbody></table></div>'+
      '<p class="tip">Click any cell to fill it. Missing one day costs almost nothing. Missing two is how a habit quietly ends, so the row flags it.</p></div>'+
    '<div class="cols"><div><div class="card"><h2 class="sec">Your habits</h2>'+manage+
      '<div style="margin-top:14px"><button class="btn solid" data-act="hadd">Add a habit</button></div>'+
      '<p class="tip">A habit holds better when it hangs off something you already do without thinking. That is what the cue is for.</p></div></div>'+
    '<div><div class="card"><h2 class="sec">Current runs</h2>'+
      (live.length?live.map(function(h){
        return '<div class="settingrow"><div class="lbl">'+esc(h.name)+'</div><div class="lbl">'+habitRun(h.id)+' days</div></div>'}).join("")
        :'<p class="hint">Nothing tracked yet.</p>')+'</div></div></div>';

function viewHistory(){
  var out="",d=new Date(),n=0,shown=0;
  while(n<240&&shown<60){
    var k=dkey(d);
    if(hasDay(k)){
      var r=D(k),done=tasksOf(r).filter(function(t){return t.ok&&t.text}).length;
      out+='<div class="entry"><div class="h"><div class="dt">'+longDate(parseKey(k))+'</div>'+
        (r.score!=null?'<span class="pill">'+r.score+'/10</span>':"")+
        '<span style="color:var(--muted);font-size:12px">'+done+' done</span>'+
        '<button class="btn ghost sm" style="margin-left:auto" data-act="goto" data-k="'+k+'">Open</button></div>'+
        (r.mit.text?'<p>'+esc(r.mit.text)+'</p>':"")+
        (r.wentWell?'<p class="q">'+esc(r.wentWell)+'</p>':"")+'</div>';
      shown++;
    }
    d=addDays(d,-1);n++;
  }
  return '<div class="card">'+(out||'<p class="hint">Days you fill in will collect here.</p>')+'</div>';
}

/* ---------------- event editor ---------------- */
var evEdit=null;
function openEvent(k,id){
  var e=id?EV(k).filter(function(x){return x.id===id})[0]:null;
  evEdit={k:k,id:id||null,text:e?e.text:"",time:e?e.time:"",end:(e&&e.end)?e.end:""};
  renderEvent();
}
function renderEvent(){
  if(!evEdit){el("modal2").innerHTML="";return}
  el("modal2").innerHTML='<div class="scrim" data-act="evscrim"><div class="sheet narrow">'+
    '<h3>'+(evEdit.id?"Edit event":"New event")+'</h3>'+
    '<p class="lead">'+longDate(parseKey(evEdit.k))+'</p>'+
    '<label class="f">What</label><input class="line" id="evText" value="'+esc(evEdit.text)+'" placeholder="Committee meeting">'+
    '<label class="f">Time, if it has one</label><input class="line" id="evTime" value="'+esc(evEdit.time)+'" placeholder="09:30">'+
    '<label class="f">Ends, if it runs more than a day</label>'+
    '<input class="line" id="evEnd" type="date" value="'+esc(evEdit.end)+'" min="'+dkey(addDays(parseKey(evEdit.k),1))+'">'+
    '<p class="hint">Leave this blank for a single day. Set it and the event runs as one band across the calendar.</p>'+
    '<div class="sheetfoot">'+(evEdit.id?'<button class="btn ghost del" data-act="evdel">Delete</button>':"<span></span>")+
    '<div style="display:flex;gap:8px"><button class="btn" data-act="evcancel">Cancel</button>'+
    '<button class="btn solid" data-act="evsave">Save</button></div></div></div></div>';
  var t=el("evText");if(t&&t.focus)t.focus();
}
function saveEvent(){
  var tx=el("evText"),tm=el("evTime"),en=el("evEnd");
  var text=tx?tx.value.trim():"",time=tm?tm.value.trim():"";
  var end=en?en.value.trim():"";
  /* an end that is missing, malformed, or not after the start is just a single day */
  if(!/^\d{4}-\d{2}-\d{2}$/.test(end)||end<=evEdit.k)end="";
  if(!text){evEdit=null;renderEvent();return}
  var list=EV(evEdit.k);
  if(evEdit.id)list.forEach(function(x){
    if(x.id===evEdit.id){
      x.text=text;x.time=time;
      if(end)x.end=end;else delete x.end;
      stamp(x);
    }});
  else{
    var ne={id:"e"+Date.now()+Math.floor(Math.random()*99),text:text,time:time};
    if(end)ne.end=end;
    list.push(stamp(ne));
  }
  evEdit=null;save();renderEvent();render();
}

function dueSteps(){
  var now=new Date(),tk=dkey(now),date=parseKey(tk),tom=addDays(date,1),nk=dkey(tom);
  var evening=now.getHours()>=S.settings.evening;
  var wk=wkey(date),mk=mkey(date),nwk=wkey(tom),nmk=mkey(tom),steps=[];
  if(evening){
    steps.push({t:"habits",k:tk});
    if(!dayReviewed(tk))steps.push({t:"day-review",k:tk});
    if(date.getDay()===0&&!weekReviewed(wk))steps.push({t:"week-review",k:wk});
    if(lastOfMonth(date)&&!monthReviewed(mk))steps.push({t:"month-review",k:mk});
    steps.push({t:"calendar",k:nk});
    if(nmk!==mk&&!monthPlanned(nmk))steps.push({t:"month-plan",k:nmk});
    if(nwk!==wk&&!weekPlanned(nwk))steps.push({t:"week-plan",k:nwk});
    steps.push({t:"day-plan",k:nk});
  }else{
    var pw=wkey(addDays(date,-7)),pm=mkey(new Date(date.getFullYear(),date.getMonth(),0));
    if(date.getDate()<=3&&!monthReviewed(pm))steps.push({t:"month-review",k:pm});
    if(date.getDay()<=2&&!weekReviewed(pw))steps.push({t:"week-review",k:pw});
    if(date.getDate()<=5&&!monthPlanned(mk))steps.push({t:"month-plan",k:mk});
    if(!weekPlanned(wk))steps.push({t:"week-plan",k:wk});
    steps.push({t:dayPlanned(tk)?"day-confirm":"day-plan",k:tk});
  }
  return steps;
}

function startTimer(mode,taskPath){
  var m=mode==="focus"?S.settings.focusMin:S.settings.breakMin;
  S.timer={mode:mode,dur:m*60,endsAt:Date.now()+m*60000,paused:false,left:m*60,task:taskPath||null};
  save();renderTimer();
}
function tick(){
  if(!S.timer||S.timer.paused)return;
  if(Math.round((S.timer.endsAt-Date.now())/1000)<=0)finishTimer();
  else if(view==="today")renderTimer();
}
function finishTimer(){
  var t=S.timer;S.timer=null;
  if(t.mode==="focus"){
    var task=null;
    if(t.task){try{task=taskAt(t.task)}catch(e){}}
    if(!task)task=D(dkey(new Date())).mit;
    task.done=Math.min(5,task.done+1);
  }
  save();beep();
  if(view==="today")render();
  if(t.mode==="focus")startTimer("break");
}
function beep(){
  try{
    var A=new(window.AudioContext||window.webkitAudioContext)(),o=A.createOscillator(),g=A.createGain();
    o.connect(g);g.connect(A.destination);o.frequency.value=660;o.type="sine";
    g.gain.setValueAtTime(.001,A.currentTime);
    g.gain.exponentialRampToValueAtTime(.2,A.currentTime+.05);
    g.gain.exponentialRampToValueAtTime(.001,A.currentTime+1.1);
    o.start();o.stop(A.currentTime+1.2);
  }catch(e){}
}

/* Restoring is meant to win. Every record in the backup is re-stamped to now, so
   the next merge keeps it instead of quietly replacing it with the gist's older
   copy, which is what used to happen. Records the gist has that the backup does
   not are still kept, so a restore overwrites but never deletes. */
function importState(d){
  if(!d||typeof d!=="object"||!d.days||typeof d.days!=="object")throw new Error("not a backup");
  function objs(o){
    var out={};
    if(o&&typeof o==="object"&&!Array.isArray(o))
      Object.keys(o).forEach(function(k){if(o[k]&&typeof o[k]==="object")out[k]=o[k]});
    return out;
  }
  var base=blankState(),now=Date.now(),s={
    v:DATA_V,
    settings:Object.assign(base.settings,d.settings||{}),
    meta:Object.assign(base.meta,d.meta||{}),
    habits:Array.isArray(d.habits)?d.habits.filter(function(h){return h&&h.id}):[],
    days:objs(d.days),weeks:objs(d.weeks),months:objs(d.months),events:objs(d.events),timer:null
  };
  Object.keys(s.events).forEach(function(k){
    s.events[k]=Array.isArray(s.events[k])?s.events[k].filter(function(x){return x&&x.id}):[];
  });
  function bump(o){if(o&&typeof o==="object")o.u=now}
  bump(s.settings);
  s.habits.forEach(bump);
  ["days","weeks","months"].forEach(function(sec){Object.keys(s[sec]).forEach(function(k){bump(s[sec][k])})});
  Object.keys(s.events).forEach(function(k){s.events[k].forEach(bump)});
  S=s;save();applyTheme();render();
}

/* ---------------- sync ---------------- */
/* Data lives in one private GitHub gist. Each day, week, month, event and habit
   carries a change timestamp, so two devices merge instead of overwriting. */
var SKEY="planner.sync", FILE="planner-data.json";
var sync={token:"",gist:"",last:0}, syncState="off", syncMsg="", pushTimer=null, pulling=false;
function loadSync(){try{var r=localStorage.getItem(SKEY);if(r)sync=JSON.parse(r)}catch(e){}}
function saveSync(){try{localStorage.setItem(SKEY,JSON.stringify(sync))}catch(e){}}
function payload(){return{v:DATA_V,settings:S.settings,habits:S.habits,days:S.days,weeks:S.weeks,months:S.months,events:S.events}}
function newer(a,b){return((b&&b.u)||0)>((a&&a.u)||0)?b:a}
/* Serialise with object keys sorted, so "did anything actually change" compares
   content rather than the order two devices happened to accumulate their keys
   in. Arrays keep their order, because for habits and events order is the data. */
function stable(o){
  if(o===null||typeof o!=="object")return JSON.stringify(o);
  if(Array.isArray(o))return "["+o.map(function(x){var s=stable(x);return s===undefined?"null":s}).join(",")+"]";
  var parts=[];
  Object.keys(o).sort().forEach(function(k){
    var s=stable(o[k]);
    if(s!==undefined)parts.push(JSON.stringify(k)+":"+s);
  });
  return "{"+parts.join(",")+"}";
}
function mergeState(loc,rem){
  var out={v:DATA_V,settings:newer(loc.settings,rem.settings)||loc.settings,habits:[],days:{},weeks:{},months:{},events:{}};
  ["days","weeks","months"].forEach(function(sec){
    var seen={},a=loc[sec]||{},b=rem[sec]||{};
    Object.keys(a).forEach(function(k){seen[k]=1});
    Object.keys(b).forEach(function(k){seen[k]=1});
    Object.keys(seen).forEach(function(k){
      out[sec][k]=!a[k]?b[k]:(!b[k]?a[k]:newer(a[k],b[k]));
    });
  });
  var ea=loc.events||{},eb=rem.events||{},edates={};
  Object.keys(ea).forEach(function(k){edates[k]=1});
  Object.keys(eb).forEach(function(k){edates[k]=1});
  Object.keys(edates).forEach(function(k){
    var by={},order=[];
    (ea[k]||[]).concat(eb[k]||[]).forEach(function(e){
      if(!e||!e.id)return;
      if(!by[e.id]){by[e.id]=e;order.push(e.id)}else by[e.id]=newer(by[e.id],e);
    });
    out.events[k]=order.map(function(id){return by[id]});
  });
  var hb={},horder=[];
  (loc.habits||[]).concat(rem.habits||[]).forEach(function(h){
    if(!h||!h.id)return;
    if(!hb[h.id]){hb[h.id]=h;horder.push(h.id)}else hb[h.id]=newer(hb[h.id],h);
  });
  out.habits=horder.map(function(id){return hb[id]});
  return out;
}
function applyMerged(m){
  S.settings=m.settings;S.habits=m.habits;S.days=m.days;S.weeks=m.weeks;S.months=m.months;S.events=m.events;
}
function gh(path,opts){
  opts=opts||{};opts.headers=Object.assign({
    "Accept":"application/vnd.github+json",
    "Authorization":"Bearer "+sync.token,
    "X-GitHub-Api-Version":"2022-11-28"
  },opts.headers||{});
  return fetch("https://api.github.com"+path,opts).then(function(r){
    if(r.status===401||r.status===403)throw new Error("token");
    if(!r.ok)throw new Error("http "+r.status);
    return r.json();
  });
}
function setSync(state,msg){syncState=state;syncMsg=msg||"";renderSync()}
function renderSync(){
  var b=el("syncBtn"),t=el("syncTxt");if(!b||!t)return;
  b.className="syncbtn"+(syncState==="ok"?" on":syncState==="busy"?" busy":syncState==="bad"?" bad":"");
  if(syncState==="off")t.textContent="Sync off";
  else if(syncState==="busy")t.textContent="Syncing";
  else if(syncState==="bad")t.textContent=syncMsg||"Sync problem";
  else{
    var m=Math.round((Date.now()-(sync.last||0))/60000);
    t.textContent=m<1?"Synced just now":m<60?"Synced "+m+"m ago":"Synced "+Math.round(m/60)+"h ago";
  }
}
function schedulePush(){
  if(!sync.token)return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(function(){syncNow(true)},4000);
}
function syncNow(quiet){
  if(!sync.token){setSync("off");return Promise.resolve()}
  if(pulling)return Promise.resolve();
  pulling=true;setSync("busy");
  var local=payload();
  var step=sync.gist
    ? gh("/gists/"+sync.gist).then(function(g){
        var f=g.files&&g.files[FILE];
        if(!f)return{};
        if(f.truncated&&f.raw_url)return fetch(f.raw_url).then(function(r){return r.json()});
        return JSON.parse(f.content||"{}");
      })
    : Promise.resolve(null);
  return step.then(function(remote){
    if(remote===null){
      return gh("/gists",{method:"POST",body:JSON.stringify({
        description:"Planner data. Do not edit by hand.",public:false,
        files:(function(o){o[FILE]=({content:JSON.stringify(local)});return o})({})
      })}).then(function(g){sync.gist=g.id;sync.last=Date.now();saveSync();setSync("ok");render()});
    }
    var merged=mergeState(local,remote||{});
    var mergedStr=JSON.stringify(merged),mergedCanon=stable(merged);
    if(mergedCanon!==stable(local)){
      applyMerged(merged);
      try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
      render();
    }
    if(mergedCanon!==stable(remote||{})){
      return gh("/gists/"+sync.gist,{method:"PATCH",body:JSON.stringify({
        files:(function(o){o[FILE]={content:mergedStr};return o})({})
      })}).then(function(){sync.last=Date.now();saveSync();setSync("ok")});
    }
    sync.last=Date.now();saveSync();setSync("ok");
  }).catch(function(err){
    var m=String(err&&err.message||err);
    setSync("bad",m==="token"?"Token rejected":"Offline");
    if(!quiet&&m==="token")alert("GitHub rejected the token. Check that it has Gists write permission and has not expired.");
  }).then(function(){pulling=false});
}
function connectSync(){
  var tok=el("syncToken"),gid=el("syncGist");
  sync.token=tok?tok.value.trim():"";
  sync.gist=gid?gid.value.trim():"";
  saveSync();
  if(!sync.token){setSync("off");render();return}
  syncNow().then(render);
}
function disconnectSync(){
  sync={token:"",gist:"",last:0};saveSync();setSync("off");render();
}

  if(e.key==="Enter"&&evEdit&&(e.target.id==="evText"||e.target.id==="evTime"||e.target.id==="evEnd")){saveEvent();return}
  if(e.key==="Enter"&&e.target.id==="capIn"){

  }

var STAMPING={check:1,est:1,dot:1,habit:1,score:1,shutdown:1,capadd:1,capdel:1};
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var a=b.dataset.act;
  if((a==="scrim"||a==="evscrim")&&e.target!==b)return;
  if(STAMPING[a]){
    if(b.dataset.k)touchDay(b.dataset.k);
    else if(b.dataset.p)touchDay(b.dataset.p.split("|")[1]);
  }
  switch(a){
    case "syncnow": syncNow();break;
    case "syncconnect": connectSync();break;
    case "syncoff": disconnectSync();break;
    case "more": moreOpen=true;renderMore();break;
    case "moreclose": case "morescrim": closeMore();break;
    case "tab": view=b.dataset.v;cursor=dkey(new Date());closeMore();render();window.scrollTo(0,0);break;
    case "goto": cursor=b.dataset.k;view="today";render();window.scrollTo(0,0);break;
    case "shift": cursor=(+b.dataset.n)?dkey(addDays(parseKey(cursor),+b.dataset.n)):dkey(new Date());render();break;
    case "shiftm":
      if(+b.dataset.n===0)cursor=dkey(new Date());
      else{var c=parseKey(cursor);cursor=dkey(new Date(c.getFullYear(),c.getMonth()+(+b.dataset.n),1))}
      render();break;
    case "theme":
      var curT=document.documentElement.getAttribute("data-theme");
      S.settings.theme=(curT==="dark"||curT==="night")?"light":"dark";
      save();applyTheme();renderHeader();break;
    case "check": var t1=taskAt(b.dataset.p);t1.ok=!t1.ok;save();render();break;
    case "est": var t2=taskAt(b.dataset.p);t2.est=(t2.est+1)%6;save();render();break;
    case "dot": var t3=taskAt(b.dataset.p),n3=+b.dataset.i+1;t3.done=(t3.done===n3)?n3-1:n3;save();render();break;
    case "attach": startTimer("focus",b.dataset.p);break;
    case "habit":
      var dd=D(b.dataset.k);
      if(dd.habits[b.dataset.h])delete dd.habits[b.dataset.h];else dd.habits[b.dataset.h]=true;
      save();render();break;
    case "score": D(b.dataset.k).score=+b.dataset.v;save();render();break;
    case "shutdown": var ds=D(b.dataset.k);ds.shutdown=!ds.shutdown;save();render();break;
    case "capadd":
      var inp=el("capIn"),v2=inp?inp.value.trim():"";
      if(v2){D(b.dataset.k).capture.push(v2);save();render()}break;
    case "capdel": D(b.dataset.k).capture.splice(+b.dataset.i,1);save();render();break;
    case "addev": openEvent(b.dataset.k,null);break;
    case "editev": openEvent(b.dataset.k,b.dataset.id);break;
    case "evsave": saveEvent();break;
    case "evcancel": case "evscrim": evEdit=null;renderEvent();break;
    case "evdel":
      EV(evEdit.k).forEach(function(x){if(x.id===evEdit.id){x.del=true;stamp(x)}});
      evEdit=null;save();renderEvent();render();break;
    case "tstart": startTimer(b.dataset.m);break;
    case "tpause": S.timer.left=Math.max(0,Math.round((S.timer.endsAt-Date.now())/1000));S.timer.paused=true;save();renderTimer();break;
    case "tresume": S.timer.endsAt=Date.now()+S.timer.left*1000;S.timer.paused=false;save();renderTimer();break;
    /* back to the top of the session and held there, keeping the mode and the linked task */
    case "treset": S.timer.left=S.timer.dur;S.timer.paused=true;S.timer.endsAt=Date.now()+S.timer.dur*1000;save();renderTimer();break;
    case "tstop": S.timer=null;save();renderTimer();break;
    case "flow": openFlow();break;
    case "flowclose": case "scrim": closeFlow();break;
    case "flowback": flow.i--;renderFlow();break;
    case "flownext": if(flow.i>=flow.steps.length-1)closeFlow();else{flow.i++;renderFlow()}break;
    case "hadd":
      var n1=prompt("What habit do you want to track?");
      if(n1&&n1.trim()){
        var cue=prompt("What already happens right before it? That becomes the cue.\nFor example: after I pour the first coffee")||"";
        S.habits.push(stamp({id:"h"+Date.now(),name:n1.trim(),cue:cue.trim(),arch:false}));save();render();
      }break;
    case "hedit":
      var h1=S.habits.filter(function(x){return x.id===b.dataset.h})[0];
      var nn=prompt("Habit name",h1.name);if(nn===null)break;
      var nc=prompt("Cue, the thing that happens right before it",h1.cue||"");
      h1.name=nn.trim()||h1.name;h1.cue=(nc||"").trim();stamp(h1);save();render();break;
    case "htoggle":
      var h2=S.habits.filter(function(x){return x.id===b.dataset.h})[0];h2.arch=!h2.arch;stamp(h2);save();render();break;
    case "hdel":
      if(confirm("Delete this habit? Past marks stay in your data but stop showing."))
        {S.habits.forEach(function(x){if(x.id===b.dataset.h){x.del=true;stamp(x)}});save();render()}break;
    case "export": exportJson();break;
    case "md": exportMd();break;
    case "importbtn":
      if(sync.token&&!confirm("Sync is on. The backup will be restored here and pushed to your other device. Days recorded since the backup that are not in it are kept, not deleted. Continue?"))break;
      el("importFile").click();break;
    case "reset":
      if(!confirm("This erases every entry on this computer. Export a backup first if you want one."))break;
      if(sync.token&&confirm("Sync is still on, so the gist will put everything back within a minute. Turn sync off on this device too?"))
        {clearTimeout(pushTimer);sync={token:"",gist:"",last:0};saveSync();setSync("off")}
      S=blankState();save();applyTheme();render();break;
  }
});

/* ---------------- theme and boot ---------------- */
/* On auto, the evening hour turns the app to Night. Before it, the system
   preference still decides, so Dark stays what you get in a dark room by day. */
function resolveTheme(){
  var t=S.settings.theme;
  if(t!=="auto")return t;
  if(new Date().getHours()>=S.settings.evening)return "night";
  var dark=false;try{dark=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches}catch(e){}
  return dark?"dark":"light";
}
var lastTheme="";
function applyTheme(){
  var t=resolveTheme();
  document.documentElement.setAttribute("data-theme",t);
  var m=el("themeColor");
  if(m){var p=getComputedStyle(document.documentElement).getPropertyValue("--paper").trim();if(p)m.setAttribute("content",p)}
  var changed=t!==lastTheme;lastTheme=t;return changed;
}
S=load();
if(!S.settings)S=blankState();
if(!S.meta)S.meta={lastFlow:"",lastBackup:""};
if(!S.events)S.events={};
if(!S.habits)S.habits=[];
if(S.timer&&!S.timer.paused&&S.timer.endsAt<Date.now())S.timer=null;
loadSync();
applyTheme();render();warn();
window.addEventListener("scroll",onScroll,{passive:true});
onScroll();
setInterval(tick,500);
/* so the evening hour arriving while the app is open actually turns it to Night */
setInterval(function(){if(S.settings.theme==="auto"&&applyTheme())renderHeader()},60000);

/* sync loop: pull on open, when the app comes back to the foreground, and once a minute */
if(sync.token){
  setSync("busy");
  setTimeout(function(){syncNow(true)},600);
  setInterval(function(){if(!document.hidden)syncNow(true)},60000);
  setInterval(renderSync,30000);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){clearTimeout(pushTimer);syncNow(true)}
    else syncNow(true);
  });
}else setSync("off");

if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}

var now=new Date(),phase=dkey(now)+(now.getHours()>=S.settings.evening?"-pm":"-am");
if(S.meta.lastFlow!==phase){S.meta.lastFlow=phase;save();openFlow()}
})();
</script>
